name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Install segwhy and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q

  macos:
    # Not tested by the author yet: kept non-blocking until it is green.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install segwhy and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q
