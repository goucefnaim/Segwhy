name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Install segwhy and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q

  macos:
    # Not tested by the author yet: kept non-blocking until it is green.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install segwhy and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q -rfE --tb=short 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Report (readable as annotations)
        if: always()
        run: |
          annotate() { python3 -c 'import sys; t=sys.stdin.read()[-60000:]; print("::notice title=%s::" % sys.argv[1] + t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "$1"; }
          grep -E "FAILED|ERROR|passed|failed" pytest.log | annotate "pytest summary" || true
          { cc --version; uname -a; } 2>&1 | annotate "toolchain"
          cd tests/crashes
          for f in recursion string_literal global_array div_zero libc_null args; do
            NO_COLOR=1 segwhy "$f.c" 2>&1 | annotate "segwhy $f.c"
          done
          NO_COLOR=1 segwhy project/main.c project/parser.c 2>&1 | annotate "segwhy project"
          F="-g -O0 -fsanitize=address -fno-omit-frame-pointer -fno-common"
          for f in recursion string_literal global_array; do
            cc $F $f.c -o /tmp/$f 2>&1; ASAN_OPTIONS=color=never /tmp/$f 2>&1 | grep -v "^ *x\[" | head -40 | annotate "raw $f"
          done
          U="-g -O0 -fsanitize=address,integer-divide-by-zero -fno-sanitize-recover=integer-divide-by-zero -fno-omit-frame-pointer -fno-common"
          { cc $U div_zero.c -o /tmp/dz -lm; echo "build exit=$?"; UBSAN_OPTIONS=print_stacktrace=0 /tmp/dz; echo "run exit=$?"; } 2>&1 | head -30 | annotate "raw div_zero"
          cc $F project/main.c project/parser.c -o /tmp/proj && ASAN_OPTIONS=color=never /tmp/proj 2>&1 | head -30 | annotate "raw project"
