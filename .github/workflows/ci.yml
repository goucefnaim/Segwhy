name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Install segwhy and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install segwhy and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q -rfE --tb=short 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Report failures (readable as annotations)
        if: failure()
        run: |
          grep -E "FAILED|ERROR|passed|failed" pytest.log | python3 -c 'import sys; t=sys.stdin.read()[-60000:]; print("::notice title=pytest summary::" + t.replace("%","%25").replace("\r","").replace("\n","%0A"))'
