name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Install segwhy and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q
      - name: Check a real install (like users do)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q .
          cd /tmp
          /tmp/venv/bin/segwhy --version
          gcc -g -O0 "$GITHUB_WORKSPACE/tests/crashes/null_deref.c" -o /tmp/nd
          /tmp/venv/bin/segwhy /tmp/nd 2>&1 | tee out.txt || true
          grep -q "'n' is NULL" out.txt
          /tmp/venv/bin/segwhy --fr --help | grep -q Utilisation

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install segwhy and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q -rfE --tb=short 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Report failures (readable as annotations)
        if: failure()
        run: |
          grep -E "FAILED|ERROR|passed|failed" pytest.log | python3 -c 'import sys; t=sys.stdin.read()[-60000:]; print("::notice title=pytest summary::" + t.replace("%","%25").replace("\r","").replace("\n","%0A"))'
