[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "segwhy"
version = "0.1.0"
description = "Tells you why your C program crashed (segfault, memory error) in plain words: reason, line, hint."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "goucefnaim" }]
keywords = ["c", "segfault", "segmentation fault", "debugging", "addresssanitizer", "gdb", "students"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/goucefnaim/Segwhy"
Issues = "https://github.com/goucefnaim/Segwhy/issues"

[project.scripts]
segwhy = "segwhy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
